services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: albums
      POSTGRES_PASSWORD: albums
      POSTGRES_DB: albums
    ports: ["5432:5432"]
    volumes: ["pgdata_dev:/var/lib/postgresql/data"]

  backend:
    build: ./../backend
    env_file: ./../backend/.env.example
    ports: ["8000:8000"]
    volumes:
      - ./../backend:/app
    depends_on: [postgres]

  frontend:
    image: ghcr.io/cirruslabs/flutter:3.24.3
    working_dir: /app
    command: bash -lc "flutter pub get && flutter run -d web-server --web-port 3000 --web-hostname 0.0.0.0"
    ports: ["3000:3000"]
    volumes:
      - ./../frontend:/app
    depends_on: [backend]

volumes:
  pgdata_dev:
